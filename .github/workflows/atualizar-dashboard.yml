name: Atualizar painel

on:
  schedule:
    # 10:00 UTC = 07:00 em Brasília (UTC-3, sem horário de verão)
    - cron: "0 10 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gerar painel
        run: python gerar_dashboard.py

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Painel de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git push
